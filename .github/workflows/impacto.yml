name: impacto-android
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ABI: arm64-v8a
      MINSDKVERSION: 28
      VCPKG_DEFAULT_TRIPLET: arm64-android-ci
      # Disable the upstream NuGet binary cache in this fork; build dependencies from source.
      VCPKG_BINARY_SOURCES: clear
      vcpkgCommitId: 62159a45e18f3a9ac0548628dcaf74fcb60c6ff9
      VCPKG_FORCE_DOWNLOADED_BINARIES: 1
    steps:
      - uses: actions/checkout@v6

      - name: Set up Android environment
        shell: bash
        run: |
          echo "MINSDKVERSION=28" >> "$GITHUB_ENV"
          echo "ABI=arm64-v8a" >> "$GITHUB_ENV"
          echo "CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --target=aarch64-linux-android28 -fPIC" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.workspace }}/build/vcpkg
          vcpkgGitCommitId: ${{ env.vcpkgCommitId }}
          vcpkgJsonGlob: "**/vcpkg.json"

      - name: Configure and build native Android runtime
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/CMakeLists.txt
          configurePreset: ci-release-android
          configurePresetAdditionalArgs: >-
            [
              '-DVCPKG_TARGET_TRIPLET=arm64-android-ci',
              '-DVCPKG_HOST_TRIPLET=x64-linux-ci'
            ]
          buildPreset: ci-release-android

      - name: Build debug APK
        shell: bash
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../release
          cp distribution/android/app/outputs/apk/debug/app-debug.apk ../release/impacto-android-arm64-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: impacto-android-arm64-debug
          path: release/impacto-android-arm64-debug.apk
          if-no-files-found: error
